name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: rm -rf android/app/src/main/res/mipmap-anydpi-v26 && cp -r icons/* android/app/src/main/res/
      - run: npx cap sync android
      - run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SolarCalc-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
